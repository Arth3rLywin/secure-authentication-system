<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access Token</title>
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: 'Segoe UI', sans-serif;
          background: linear-gradient(to right, #dbe9f4, #f0f4fc);
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }

        .tablet-background {
            background-color: #2c3e50;
            width: 1000px;
            max-width: 90%;
            height: 600px;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.4), 0 0 60px rgba(52,152,219,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 50px auto;
        }

        .tablet-wrapper {
          background: white;
          padding: 30px;
          border-radius: 20px;
          box-shadow: 0 8px 24px rgba(0,0,0,0.1);
          width: 360px;
          max-width: 90%;
          text-align: center;
        }

        h2 {
          margin-bottom: 20px;
          font-size: 20px;
          color: #333;
        }

        .token-box {
          background: #f5f5f5;
          border: 1px solid #ccc;
          border-radius: 8px;
          padding: 12px;
          height: 80px;
          overflow-y: auto;
          font-family: monospace;
          word-break: break-word;
          margin-bottom: 20px;
          transition: opacity 1s ease-in-out;
        }

        .button-row {
          display: flex;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 10px;
        }

        button {
          flex: 1;
          padding: 10px;
          border: none;
          border-radius: 6px;
          font-weight: bold;
          cursor: pointer;
        }

        .validate-btn {
          background-color: #28a745;
          color: white;
        }

        .copy-btn {
          background-color: #007bff;
          color: white;
        }

        .message {
          font-size: 14px;
          margin-top: 10px;
          color: #555;
        }

        .error {
          color: red;
        }

        .success {
          color: green;
        }

        a {
          color: #007bff;
          text-decoration: none;
        }

        a:hover {
          text-decoration: underline;
        }

        .faded {
          opacity: 0.3;
        }

        .disabled {
          pointer-events: none;
          opacity: 0.6;
        }
    </style>
</head>
<body>
<div class="tablet-background">
    <div class="tablet-wrapper">
        <h2>Access Token</h2>
        <div class="token-box" th:text="${token}" id="tokenDisplay">Loading...</div>

        <div class="button-row">
            <button class="validate-btn" id="validateBtn" onclick="validateToken()">Validate</button>
            <button class="copy-btn" id="copyBtn" onclick="copyToken()">Copy</button>
        </div>

        <div class="message" id="countdown"></div>
        <div class="message" id="messageArea"></div>
    </div>
</div>

<script>
    const tokenDisplayEl = document.getElementById("tokenDisplay");
    const token = tokenDisplayEl.textContent.trim();

    const countdownEl = document.getElementById("countdown");
    const validateBtn = document.getElementById("validateBtn");
    const copyBtn = document.getElementById("copyBtn");

    let timeLeft = 60;
    const timer = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(timer);
        tokenDisplayEl.classList.add("faded");
        validateBtn.classList.add("disabled");
        copyBtn.classList.add("disabled");
        countdownEl.innerHTML = `⏰ Token expired.<br><a href="/auth/login">🔁 Please relogin here</a>`;
      } else {
        countdownEl.textContent = `⏳ Token expires in ${timeLeft} seconds`;
        timeLeft--;
      }
    }, 1000);

    function validateToken() {
      if (token && timeLeft > 0) {
        window.location.href = "/dashboard";
      } else {
        document.getElementById("messageArea").innerHTML = `
          ❌ Token invalid or expired.<br>
          <a href="/auth/login">🔁 Please relogin here</a>
        `;
      }
    }

    function copyToken() {
      navigator.clipboard.writeText(token).then(() => {
        document.getElementById("messageArea").textContent = "📋 Token copied!";
      });
    }
</script>
</body>
</html>
